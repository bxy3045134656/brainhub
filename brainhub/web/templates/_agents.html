{# agent 状态面板 partial — Phase 2 占位 #}
<div class="max-w-3xl mx-auto" x-data="{ agents: [], initWS() {
    try {
        const proto = location.protocol === 'https:' ? 'wss' : 'ws';
        const ws = new WebSocket(`${proto}://${location.host}/ws`);
        ws.onopen = () => ws.send(JSON.stringify({topics: ['agent_status']}));
        ws.onmessage = (e) => {
            const m = JSON.parse(e.data);
            if (m.topic === 'agent_status' && m.agents) { this.agents = m.agents; }
        };
    } catch (err) {}
} }" x-init="initWS()">
    <h2 class="text-sm font-semibold text-gray-600 mb-3">Agent 状态</h2>
    <div class="bg-white border rounded p-4 text-sm text-gray-500">
        <p class="mb-2">Phase 2：OpsAgent 为接口壳，状态灯接 WS <code>agent_status</code> topic。</p>
        <p>Phase 3 ReAct 循环落地后，此处显示 agent 在线/离线 + 当前任务。</p>
    </div>
    <ul class="mt-3 space-y-2">
        <template x-for="a in agents" :key="a.name">
            <li class="bg-white border rounded p-2 text-sm flex items-center gap-2">
                <span class="w-2 h-2 rounded-full" :class="a.online ? 'bg-green-500' : 'bg-gray-400'"></span>
                <span class="font-medium" x-text="a.name"></span>
                <span class="text-gray-400 text-xs" x-text="a.current_task || 'idle'"></span>
            </li>
        </template>
    </ul>
</div>
