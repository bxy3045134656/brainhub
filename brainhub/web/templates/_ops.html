{# 运维日志面板 partial：历史 + WS 实时 prepend #}
<div class="max-w-4xl mx-auto" x-data="{ logs: {{ logs | tojson }}, initWS() {
    try {
        const proto = location.protocol === 'https:' ? 'wss' : 'ws';
        const ws = new WebSocket(`${proto}://${location.host}/ws`);
        ws.onopen = () => ws.send(JSON.stringify({topics: ['ops_log']}));
        ws.onmessage = (e) => {
            const m = JSON.parse(e.data);
            if (m.topic === 'ops_log') { this.logs.unshift(m); if (this.logs.length > 200) this.logs.pop(); }
        };
    } catch (err) { console.warn('WS 失败', err); }
} }" x-init="initWS()">
    <h2 class="text-sm font-semibold text-gray-600 mb-3">运维日志（实时）</h2>
    <div class="bg-gray-900 text-gray-100 rounded p-3 font-mono text-xs max-h-[70vh] overflow-auto">
        <template x-for="l in logs" :key="l.id || l.ts + l.action">
            <div class="py-0.5" :class="l.result === 'fail' ? 'text-red-400' : (l.result === 'warn' ? 'text-yellow-400' : 'text-green-300')">
                <span x-text="l.ts ? (l.ts.slice(11,19) || l.ts) : ''" class="text-gray-500"></span>
                <span class="text-blue-300" x-text="l.task || ''"></span>
                <span x-text="l.action || ''"></span>
                <span x-show="l.detail" class="text-gray-400" x-text="l.detail ? '— ' + l.detail : ''"></span>
            </div>
        </template>
        {% if not logs %}
        <div class="text-gray-500">（暂无日志，等 cron 触发或手动跑 ops）</div>
        {% endif %}
    </div>
</div>
