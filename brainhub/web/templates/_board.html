{# 看板 partial：四列（todo/doing/blocked/done）+ 拖拽 #}
<div class="max-w-6xl mx-auto" x-data="{ dragId: null }">
    <div class="flex items-center gap-2 mb-4">
        <h2 class="text-sm font-semibold text-gray-600">项目看板</h2>
        <button class="px-2 py-1 text-xs bg-blue-600 text-white rounded hover:bg-blue-700"
                @click="$refs.newProj.open = true">+ 新项目</button>
    </div>

    {# 新项目表单（折叠）#}
    <div x-data="{ open: false }" x-ref="newProj" class="mb-4">
        <form hx-post="/api/projects" hx-target="#main" class="flex gap-2" x-show="open" x-cloak>
            <input type="text" name="name" placeholder="项目名" class="border rounded px-2 py-1 text-sm flex-1" />
            <button class="px-3 py-1 text-xs bg-gray-700 text-white rounded">创建</button>
        </form>
    </div>

    <div class="flex gap-3 overflow-x-auto pb-4">
    {% for col in statuses %}
        <div class="flex-1 min-w-[220px] bg-gray-100 rounded p-2"
             @drop.prevent="if(dragId){ const f=document.createElement('form'); f.method='POST'; f.action='/api/tasks/'+dragId+'/move'; const s=document.createElement('input'); s.name='status'; s.value='{{ col }}'; f.appendChild(s); f.style.display='none'; document.body.appendChild(f); f.submit(); }"
             @dragover.prevent>
            <div class="text-xs font-semibold text-gray-600 mb-2 capitalize">{{ col }}</div>
            <div class="space-y-2 min-h-[40px]">
            {% for t in tasks.get(col, []) %}
                <div class="bg-white border rounded p-2 text-sm cursor-move"
                     draggable="true"
                     @dragstart="dragId = '{{ t.id }}'"
                     @dragend="dragId = null">
                    <div class="font-medium">{{ t.title }}</div>
                    <div class="text-xs text-gray-400 mt-1">
                        {{ t.project_name or t.project_id[:8] }}
                        {% if t.assignee %}· {{ t.assignee }}{% endif %}
                    </div>
                </div>
            {% endfor %}
            </div>
        </div>
    {% endfor %}
    </div>

    <div class="mt-6">
        <h3 class="text-xs font-semibold text-gray-500 mb-2">新建任务</h3>
        <form hx-post="/api/tasks" hx-target="#main" class="flex flex-wrap gap-2 text-sm">
            <select name="project_id" class="border rounded px-2 py-1">
                {% for p in projects %}<option value="{{ p.id }}">{{ p.name }} ({{ p.status }})</option>{% endfor %}
            </select>
            <input type="text" name="title" placeholder="任务标题" class="border rounded px-2 py-1 flex-1 min-w-[200px]" />
            <select name="status" class="border rounded px-2 py-1">
                {% for s in statuses %}<option value="{{ s }}">{{ s }}</option>{% endfor %}
            </select>
            <input type="text" name="assignee" placeholder="负责人(可选)" class="border rounded px-2 py-1 w-32" />
            <button class="px-3 py-1 text-xs bg-blue-600 text-white rounded">+ 任务</button>
        </form>
    </div>
</div>
