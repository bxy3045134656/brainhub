{# 目录树子节点 partial：HTMX 按需 hx-get 加载 #}
<ul class="text-sm">
{% for e in entries %}
    {% if e.is_dir %}
    <li class="my-0.5">
        <details>
            <summary class="cursor-pointer hover:bg-gray-100 rounded px-1 py-0.5 select-none">
                📁 <span class="font-medium">{{ e.name }}</span>
            </summary>
            <div class="pl-4" hx-get="/api/tree?dir={{ e.rel }}" hx-trigger="load once" hx-target="this"></div>
        </details>
    </li>
    {% else %}
    <li class="my-0.5">
        <a class="cursor-pointer hover:bg-blue-50 hover:text-blue-700 rounded px-1 py-0.5 block truncate"
           hx-get="/api/preview?path={{ e.rel }}" hx-target="#preview-container">
            📄 <span>{{ e.name }}</span>
        </a>
    </li>
    {% endif %}
{% endfor %}
{% if not entries %}
    <li class="text-gray-400 px-1 py-0.5">（空目录）</li>
{% endif %}
</ul>
